<title>Barefoot 販売実績ダッシュボード</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f3f0;
    --surface-1: #fcfcfb;
    --surface-2: #ffffff;
    --border: #e4e2dc;
    --text-primary: #16150f;
    --text-secondary: #52514e;
    --text-muted: #8a887f;
    --series-1: #2a78d6; /* blue   - VFF */
    --series-2: #eb6834; /* orange - Coolcore */
    --series-3: #1baf7a; /* aqua   - Oleno */
    --series-4: #eda100; /* yellow - BFJ */
    --series-5: #e87ba4; /* magenta- TabiRela */
    --series-6: #008300; /* green  - Others */
    --series-7: #4a3aa7; /* violet */
    --series-8: #e34948; /* red */
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --grid: #e9e7e1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #131311;
      --surface-1: #1a1a19;
      --surface-2: #202020;
      --border: #333230;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8d83;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
      --grid: #2a2a28;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #131311;
    --surface-1: #1a1a19;
    --surface-2: #202020;
    --border: #333230;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8d83;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
    --grid: #2a2a28;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0 0 4rem;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 1.75rem 1.5rem 0; }

  header.page { padding: 0.25rem 0 1.25rem; }
  header.page h1 { font-size: 1.5rem; margin: 0 0 0.3rem; font-weight: 700; }
  header.page .meta { color: var(--text-secondary); font-size: 0.85rem; }

  nav.tabs {
    display: flex; gap: 0.25rem; border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem; overflow-x: auto;
  }
  nav.tabs button {
    background: none; border: none; padding: 0.65rem 0.9rem; font-size: 0.88rem;
    color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent;
    white-space: nowrap; font-weight: 500; font-family: inherit;
  }
  nav.tabs button.active { color: var(--text-primary); border-bottom-color: var(--series-1); }
  nav.tabs button:hover { color: var(--text-primary); }

  section.tabpanel { display: none; }
  section.tabpanel.active { display: block; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; margin-bottom: 1.5rem; }
  .kpi-tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.9rem 1.05rem;
  }
  .kpi-tile .label { color: var(--text-secondary); font-size: 0.78rem; margin-bottom: 0.35rem; }
  .kpi-tile .value { font-size: 1.55rem; font-weight: 700; font-variant-numeric: proportional-nums; }
  .kpi-tile .sub { color: var(--text-muted); font-size: 0.74rem; margin-top: 0.2rem; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.15rem 1.25rem; margin-bottom: 1.25rem;
  }
  .card h2 { font-size: 1rem; margin: 0 0 0.15rem; font-weight: 700; }
  .card .card-sub { color: var(--text-secondary); font-size: 0.78rem; margin-bottom: 0.9rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  @media (max-width: 860px) { .grid-2, .kpi-row { grid-template-columns: 1fr 1fr; } }

  table.data { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.data th, table.data td { padding: 0.5rem 0.6rem; text-align: right; border-bottom: 1px solid var(--border); }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--text-secondary); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.02em; }
  table.data td { font-variant-numeric: tabular-nums; }
  table.data tr:hover td { background: color-mix(in srgb, var(--series-1) 6%, transparent); }
  .badge {
    display: inline-block; font-size: 0.68rem; padding: 0.12rem 0.5rem; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-secondary);
  }

  .legend { display: flex; flex-wrap: wrap; gap: 0.9rem; margin-top: 0.7rem; font-size: 0.78rem; color: var(--text-secondary); }
  .legend .item { display: flex; align-items: center; gap: 0.4rem; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .store-picker { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
  .store-picker button {
    font-family: inherit; font-size: 0.78rem; padding: 0.35rem 0.75rem; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary); cursor: pointer;
  }
  .store-picker button.active { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .store-picker .grp-label { font-size: 0.72rem; color: var(--text-muted); align-self: center; margin-left: 0.4rem; }

  .tooltip {
    position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.5rem 0.7rem; font-size: 0.76rem; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    opacity: 0; transition: opacity 0.1s; z-index: 20; white-space: nowrap; color: var(--text-primary);
  }
  .chart-wrap { position: relative; }
  svg text { fill: var(--text-secondary); font-size: 11px; font-family: inherit; }
  svg .value-label { fill: var(--text-primary); font-weight: 600; font-size: 11px; }
  svg .axis-line { stroke: var(--grid); stroke-width: 1; }

  .note-box {
    background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--series-4);
    border-radius: 8px; padding: 0.8rem 1rem; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 1rem;
  }
  .note-box.critical { border-left-color: var(--series-8); }
  .note-box b { color: var(--text-primary); }

  ul.filelist { margin: 0.4rem 0 0; padding-left: 1.1rem; font-size: 0.82rem; color: var(--text-secondary); }
  ul.filelist li { margin-bottom: 0.3rem; }
  code { background: var(--surface-2); padding: 0.05rem 0.35rem; border-radius: 4px; font-size: 0.85em; }

  .two-col-list { columns: 2; column-gap: 2rem; }
  @media (max-width: 700px) { .two-col-list { columns: 1; } .grid-2 { grid-template-columns: 1fr; } .kpi-row { grid-template-columns: 1fr 1fr; } }
</style>

function fmtTHB(v){
  if (v==null) return '—';
  return '฿' + Math.round(v).toLocaleString('en-US');
}
function fmtNum(v){ if(v==null) return '—'; return Math.round(v).toLocaleString('en-US'); }
function fmtPct(v){ return (v*100).toFixed(1) + '%'; }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ================================================================== chart primitives
// Horizontal bar chart: [{label, value, color}], returns svg string
function hBarChart(items, opts){
  opts = opts || {};
  const w = opts.width || 560, barH = opts.barH || 22, gap = 10, labelW = opts.labelW || 150;
  const maxV = Math.max(...items.map(d => d.value), 1);
  const chartW = w - labelW - 70;
  const h = items.length * (barH + gap) + gap;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" preserveAspectRatio="xMinYMin meet">`;
  items.forEach((d, i) => {
    const y = gap + i * (barH + gap);
    const bw = Math.max((d.value / maxV) * chartW, 1);
    svg += `<text x="${labelW-8}" y="${y+barH/2+4}" text-anchor="end">${esc(d.label)}</text>`;
    svg += `<rect x="${labelW}" y="${y}" width="${bw}" height="${barH}" rx="4" fill="${d.color}" class="hbar" data-i="${i}"></rect>`;
    svg += `<text class="value-label" x="${labelW + bw + 8}" y="${y+barH/2+4}">${opts.fmt ? opts.fmt(d.value) : fmtNum(d.value)}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

// Line chart (single or multi series), months on x-axis
function lineChart(series, opts){
  opts = opts || {};
  const w = opts.width || 560, h = opts.height || 200;
  const padL = 56, padR = 16, padT = 16, padB = 28;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const allVals = series.flatMap(s => s.values);
  const maxV = Math.max(...allVals, 1) * 1.12;
  const n = MONTHS.length;
  const x = i => padL + (plotW * i) / (n - 1);
  const y = v => padT + plotH - (v / maxV) * plotH;

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" preserveAspectRatio="xMinYMin meet">`;
  // gridlines (4 steps)
  const steps = 4;
  for (let s = 0; s <= steps; s++) {
    const v = (maxV / steps) * s;
    const yy = y(v);
    svg += `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" class="axis-line"></line>`;
    svg += `<text x="${padL-8}" y="${yy+3}" text-anchor="end">${opts.fmtAxis ? opts.fmtAxis(v) : fmtNum(v)}</text>`;
  }
  MONTHS.forEach((m,i) => {
    svg += `<text x="${x(i)}" y="${h-8}" text-anchor="middle">${MONTH_LABEL[m]}</text>`;
  });
  series.forEach((s) => {
    let path = '';
    s.values.forEach((v,i) => { path += (i===0?'M':'L') + x(i) + ' ' + y(v) + ' '; });
    svg += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>`;
    s.values.forEach((v,i) => {
      svg += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2" class="pt" data-s="${s.name}" data-m="${MONTHS[i]}" data-v="${v}"></circle>`;
    });
  });
  svg += `</svg>`;
  return svg;
}

// Stacked single-row horizontal bar (composition), items [{label,value,color}]
function stackedBar(items, opts){
  opts = opts || {};
  const w = opts.width || 720, h = opts.height || 40;
  const total = items.reduce((a,d) => a+d.value, 0) || 1;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" preserveAspectRatio="xMinYMin meet">`;
  let xoff = 0;
  const gapPx = 2;
  items.forEach((d,i) => {
    const bw = Math.max((d.value/total) * w - gapPx, 0);
    svg += `<rect x="${xoff}" y="0" width="${bw}" height="${h}" rx="4" fill="${d.color}" class="seg" data-i="${i}"></rect>`;
    xoff += bw + gapPx;
  });
  svg += `</svg>`;
  return svg;
}

function attachLineTooltip(container){
  container.querySelectorAll('.pt').forEach(el => {

function attachStackTooltip(container, items, total){
  container.querySelectorAll('.seg').forEach(el => {
    const d = items[+el.dataset.i];
    el.addEventListener('mousemove', e => showTip(e, `<b>${esc(d.label)}</b><br>${fmtTHB(d.value)} (${fmtPct(d.value/total)})`));

}
